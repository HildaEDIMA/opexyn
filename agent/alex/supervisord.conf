[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; ── 1. Écran virtuel Xvfb 1280x800 ──────────────────────────────────────────
[program:xvfb]
command=Xvfb :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset
autorestart=true
priority=1
startsecs=1
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log
environment=DISPLAY=":99"

; ── 2. Openbox : gestionnaire de fenêtres ────────────────────────────────────
[program:openbox]
command=openbox-session
autorestart=true
priority=2
startsecs=2
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox.log
environment=DISPLAY=":99",HOME="/root"

; ── 3. tint2 : barre des tâches en bas ───────────────────────────────────────
[program:tint2]
command=tint2
autorestart=true
priority=3
startsecs=3
stdout_logfile=/var/log/supervisor/tint2.log
stderr_logfile=/var/log/supervisor/tint2.log
environment=DISPLAY=":99",HOME="/root"

; ── 4. x11vnc : stream l'écran via VNC ───────────────────────────────────────
; -cursor most : transmet la vraie forme du curseur via l'extension XFixes
; (sans ce flag, x11vnc capture l'écran mais jamais le curseur système,
; donc noVNC n'a rien à afficher — d'où le curseur invisible).
[program:x11vnc]
command=x11vnc -display :99 -nopw -listen 0.0.0.0 -xkb -forever -shared -cursor most
autorestart=true
priority=4
startsecs=4
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log

; ── 5. websockify : VNC → WebSocket pour noVNC ───────────────────────────────
[program:websockify]
command=websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=5
startsecs=6
stdout_logfile=/var/log/supervisor/websockify.log
stderr_logfile=/var/log/supervisor/websockify.log

; ── 6. Alex API + agent loop ─────────────────────────────────────────────────
[program:alex]
command=python main.py
directory=/app
autorestart=true
priority=6
startsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DISPLAY=":99",HOME="/root",PYTHONUNBUFFERED="1"

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock